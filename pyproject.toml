[project]
name = "agent"
version = "0.1.0"
description = "Minimal single-owner Telegram ↔ Claude Code bridge — fork, reskin with a SOUL, deploy."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28.1",
    "python-telegram-bot[job-queue]>=21",
]

# Test-only. PyYAML is what tests/test_kitbash_manifest.py parses kitbash.yaml with; the
# bot itself never reads YAML, and the image is built with --no-dev so this never ships.
[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
